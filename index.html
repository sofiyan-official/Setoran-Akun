  String(s ?? '').replace(
    /[&<>"']/g,
    c => ({

      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',

const fmtDate = d =>
  new Date(d).toLocaleString(
    'id-ID',
    {
      day:'2-digit',
      month:'2-digit',
      year:'numeric',
      hour:'2-digit',

const prefixName = email => {
  const p = String(email || '').split('@')[0];

const statusClass = s =>
  s === 'SUDAH DIBAYAR'
    ? 's-paid'
    : s === 'DITOLAK'
      ? 's-no'
      : s === 'DISETUJUI'
        ? 's-ok'

const statusLabel = s =>
  s === 'SUDAH DIBAYAR'

    : s === 'DISETUJUI'
      ? 'DITERIMA'
      : s === 'DITOLAK'
        ? 'DITOLAK'

function toast(msg){
  const old = document.querySelector('.flash');
  if(old) old.remove();

  const d = document.createElement('div');
  d.className = 'flash';
  d.textContent = msg;

  document.body.prepend(d);

  setTimeout(() => d.remove(), 3500);
}

function togglePassword(id,b){

  const x = document.getElementById(id);

  x.type =
    x.type === 'password'
      ? 'text'
      : 'password';

  b.textContent = '◉';
}

async function login(){

  const email =
    document.getElementById('loginEmail')
      .value.trim();

  const password =
    document.getElementById('loginPassword')
      .value;

  if(!email || !password){

    return toast(
      'Email dan kata sandi wajib diisi.'
    );

  }

  const {data,error} =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    return toast(error.message);

  }

  currentUser = data.user;

  await route();
}

async function register(){

  const email =
    document.getElementById('loginEmail')
      .value.trim();

  const password =
    document.getElementById('loginPassword')
      .value;

  if(!email || !password){

    return toast(
      'Isi email dan kata sandi terlebih dahulu.'
    );

  }

  const {data,error} =
    await supabaseClient.auth.signUp({
      email,
      password
    });

  if(error){

    return toast(error.message);

  }

  if(data.user){

    toast(
      'Akun anda telah dibuat silahkan login'
    );

  }

}

async function route(){

  const {
    data:{user}
  } =
    await supabaseClient.auth.getUser();

  currentUser = user;

  if(!user){

    renderLogin();
    return;

  }

  isAdmin =
    (user.email || '').toLowerCase()
    === CONFIG.ADMIN_EMAIL.toLowerCase();

  if(isAdmin){

    await renderAdmin();

  }else{

    await renderSeller();

  }

}

function updateCount(){

  const a =
    document.getElementById('accounts');

  if(!a) return;

  const lines =
    a.value
      .split(/\r?\n/)
      .map(x => x.trim())
      .filter(Boolean);

  const c =
    document.getElementById('count');

  if(c){

    c.textContent =
      String(lines.length).padStart(3,'0');

  }

}

async function submitOrder(){

  const raw =
    document.getElementById('accounts').value;

  const accounts =
    raw
      .split(/\r?\n/)
      .map(x => x.trim())
      .filter(Boolean);

  const bank =
    document.querySelector(
      'input[name="bank"]:checked'
    );

  const number =
    document.getElementById('dana')
      .value.trim();

  if(accounts.length < 50){

    return toast(
      'Minimal 50 baris akun.'
    );

  }

  if(!bank){

    return toast(
      'Centang salah satu metode rekening terlebih dahulu.'
    );

  }

  if(!number){

    return toast(
      'Masukkan nomor rekening.'
    );

  }

  const {error} =
    await supabaseClient
      .from('submissions')
      .insert({

        seller_id:currentUser.id,

        accounts:accounts.join('\n'),

        account_count:accounts.length,

        dana_number:
          `${bank.value}: ${number}`,

        status:
          'MENUNGGU PENGECEKAN',

        status_changed_at:
          new Date().toISOString()

      });

  if(error){

    return toast(error.message);

  }

  document.getElementById('accounts').value = '';

  document.getElementById('dana').value = '';

  document
    .querySelectorAll('input[name="bank"]')
    .forEach(x => x.checked = false);

  updateCount();

  toast(
    'Setoran berhasil dikirim.'
  );

  await loadSellerOrders();

}

async function loadSellerOrders(){

  const box =
    document.getElementById('sellerOrders');

  if(!box) return;

  const {data,error} =
    await supabaseClient
      .from('submissions')
      .select('*')
      .eq('seller_id',currentUser.id)
      .order('created_at',{
        ascending:false
      });

  if(error){

    box.textContent =
      error.message;

    return;

  }

  if(!data?.length){

    box.innerHTML =
      '<div class="empty">Belum ada setoran.</div>';

    return;

  }

  box.innerHTML =
    data.map(o => `

      <div class="history-card">

        <div class="order-top">

          <div class="order-left">

            ${o.account_count} akun

            <br>

            <span class="order-date">
              ${fmtDate(o.created_at)}
            </span>

            <br>

            ${esc(o.dana_number)}

          </div>

          <span
            class="status-pill ${statusClass(o.status)}"
          >
            ${statusLabel(o.status)}
          </span>

        </div>

      </div>

    `).join('');

}

  const box =
    document.getElementById('sellerMessages');

  if(!box) return;

  const {data,error} =
    await supabaseClient
      .from('messages')
      .select('*')
      .eq('seller_id',currentUser.id)
      .order('created_at',{
        ascending:true
      });

  if(error){

    box.textContent =
      error.message;

    return;

  }

  box.innerHTML =
    (data || [])
      .map(m =>
        messageHtml(
          m,
          m.sender_id === currentUser.id
        )
      )
      .join('');

  box.scrollTop =
    box.scrollHeight;

  await signImages(box)
